[workspace]

[package]
name = "risc0_call_guest"
version = "0.1.0"
edition = "2021"

[dependencies]
call_guest = { path = "../../guest" }
risc0-zkvm = { version = "=1.2.0", default-features = false, features = ["std", "unstable"] }
risc0-zkvm-platform = { version = "=1.2.0", default-features = false }
risc0-circuit-recursion = { version = "=1.2.0", default-features = false, features = ["std"] }
risc0-core = { version = "=1.2.0", default-features = false, features = ["std"] }
risc0-zkp = { version = "=1.2.0", default-features = false, features = ["std"] }
risc0-binfmt = { version = "=1.2.0", default-features = false, features = ["std"] }
risc0-groth16 = { version = "=1.2.0", default-features = false, features = ["std"] }

[patch.crates-io]
ring = { path = "../../../../ring", features = ["std"] }

